name: selftest-direct-upload

# Proves the runner -> Social Lamma media upload (repo secret SOCIAL_LAMMA_TOKEN): uploads a 3 s clip (single PUT) and a ~25 MB clip (multipart)
# as MEDIA ONLY, brand slade, never a post. Prints the test media ids. Run: gh workflow run selftest-direct-upload
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: static ffmpeg (same build as the render job)
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
        run: |
          mkdir -p "$RUNNER_TEMP/ff"
          curl -fsSL --retry 3 "$FFMPEG_URL" | tar -xJ -C "$RUNNER_TEMP/ff" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          echo "$RUNNER_TEMP/ff" >> "$GITHUB_PATH"
      - name: pip numpy (qa_media import)
        run: pip install -q numpy
      - name: upload 3 s + 25 MB test clips as media only
        env:
          SOCIAL_LAMMA_TOKEN: ${{ secrets.SOCIAL_LAMMA_TOKEN }}
          SOCIAL_LAMMA_BRAND: slade
        run: bash cloud/selftest.sh
