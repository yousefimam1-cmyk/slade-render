name: drive-move

# Move Drive files/folders (never deletes). Start: push jobs/move/<name>.json = {"ids": ["...", ...], "to": "delete"|"done"|<folder id>}.
# delete = 1CM4UYGu19cj7wkV2Q6fNhCJT8_hdr1UF, done = "done content" 1WRpaTxo-_iRaZ_37zpXa7v5VqbrnBhNC
on:
  push:
    branches: [main]
    paths: ["jobs/move/*.json"]

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: move
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          set -uo pipefail
          pip install -q cryptography
          for f in $(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/move/*.json'); do
            python3 - "$f" <<'PY' | while read id to; do python3 drive/drive_fetch.py move "$id" "$to" || echo "FAILED $id"; done
          import json, re, sys
          j = json.load(open(sys.argv[1])); to = j.get("to", "delete")
          to = {"delete": "1CM4UYGu19cj7wkV2Q6fNhCJT8_hdr1UF", "done": "1WRpaTxo-_iRaZ_37zpXa7v5VqbrnBhNC"}.get(to, to)
          assert re.fullmatch(r"[A-Za-z0-9_-]{10,100}", to), "bad folder"
          for i in j["ids"]:
              if re.fullmatch(r"[A-Za-z0-9_-]{10,100}", i): print(i, to)
          PY
          done
